name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Installed builds are signed with this certificate; a release signed with any other key cannot
  # upgrade them in place (and uninstalling loses the device-bound encrypted profiles).
  EXPECTED_SIGNER_SHA256: 4fb176c5125726f14f946394d5698acedf3d839cf61b21a1ddded79ff9b22a49

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -perm -111 | head -1)"
          fi
          echo "sdkmanager=$SM"
          # `yes` exits on SIGPIPE once sdkmanager stops reading; only sdkmanager's status matters.
          set +o pipefail
          yes | "$SM" --licenses > /dev/null
          yes | "$SM" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            KEYSTORE="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
              | grep 'SHA256:'
            echo "TMUXER_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_RESTORED=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is required to sign releases"
            exit 1
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret; this APK is signed with a throwaway key"
          fi

      - name: Test, lint & build release APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon

      - name: Verify APK signer
        if: env.SIGNING_KEY_RESTORED == 'true'
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ACTUAL="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "signer=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK signer $ACTUAL does not match $EXPECTED_SIGNER_SHA256"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tmuxer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    name: Publish tag release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The build job already signed and verified this exact APK; publish it instead of rebuilding.
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: tmuxer-release-apk

      - name: Rename APK with tag
        run: mv app-release.apk "tmuxer-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tmuxer-${{ github.ref_name }}.apk
